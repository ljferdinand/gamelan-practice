name: Deploy to GitHub Pages

# Publishes the app straight from src/ (with engine/ alongside it), so there is
# no duplicated copy of the source to keep in sync.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r src/. _site/
          mkdir -p _site/engine
          cp engine/*.mjs _site/engine/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
